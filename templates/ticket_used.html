<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>守り神診断</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    background: radial-gradient(circle at 50% 0, #3b2a78, #1b1433 70%); color: #fff; font-family: "M PLUS Rounded 1c", sans-serif; text-align: center; }
  .box { max-width: 420px; width: 100%; }
  .no { display: inline-block; padding: 6px 18px; border-radius: 99px; background: #2a2150; color: #ffcc33; font-weight: 800; }
  .pickup { background: #ffcc33; color: #3a2400; border-radius: 16px; padding: 16px; margin: 18px 0; font-weight: 800; line-height: 1.6; }
  .pickup b { display: block; font-size: 2.2rem; }
  p { color: #b9b0d9; line-height: 1.8; }
  a { display: inline-block; margin-top: 8px; padding: 14px 24px; border-radius: 99px; background: #2a2150; color: #fff; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <span class="no">チケット No.{{ t.number }}</span>
  <p>このチケットの質問はもう終わっています。</p>
  {% if pickup %}<div class="pickup">カードの受け取り時間<b>{{ pickup }}</b></div>{% endif %}
  <p>カードはお店で受け取ってね。<br>カードのQRを読むと、くわしい結果が見られるよ。</p>
</div>
</body>
</html>
