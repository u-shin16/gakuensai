<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理者画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #14202b; --panel: #1f2f3d; --panel2: #2b4152; --text: #f2f6f8; --muted: #a9bccb; --accent: #ffcc33; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: "M PLUS Rounded 1c", sans-serif; padding: 28px 16px 60px; }
  main { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.5rem; }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { background: var(--panel); border-radius: 14px; padding: 14px 16px; }
  .stat .n { font-size: 1.8rem; font-weight: 800; color: var(--accent); letter-spacing: .05em; }
  .stat .l { color: var(--muted); font-size: .85rem; }
  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .menu a { display: block; background: var(--panel); border-radius: 14px; padding: 16px 18px; color: inherit; text-decoration: none; border: 2px solid transparent; }
  .menu a:hover { border-color: var(--panel2); }
  .menu b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  .menu span { color: var(--muted); font-size: .85rem; }
  .menu .soon { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>管理者画面</h1>
  <p class="note">スタッフ用です。いまはアプリを動かしているこのパソコンからだけ開けます（Googleでのログインは、管理者の決め方が決まってから付けます）。</p>

  <div class="stats">
    <div class="stat"><div class="n">{{ cards }}</div><div class="l">これまでに作ったカード</div></div>
    <div class="stat"><div class="n">{{ plaza }}</div><div class="l">広場にいる守り神</div></div>
    <div class="stat"><div class="n">{{ code or '----' }}</div><div class="l">広場のあいことば</div></div>
  </div>

  <div class="menu">
    <a href="/admin/plaza"><b>広場の管理</b><span>あいことばを変える・守り神を広場から出す</span></a>
    <a href="/admin/characters"><b>これまでの守り神</b><span>作ったカードの一覧（好きなものも出る）</span></a>
    <a href="/plaza" target="_blank"><b>広場を開く</b><span>店の大きい画面に映す広場</span></a>
    <a href="/" target="_blank"><b>お客さんの画面を開く</b><span>診断してカードを作る画面</span></a>
    <a class="soon"><b>チケット</b><span>ミーティングで決まってから作る</span></a>
    <a class="soon"><b>受け取りの一覧</b><span>ミーティングで決まってから作る</span></a>
  </div>
</main>
</body>
</html>
