<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>どうぶつ王国の広場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "M PLUS Rounded 1c", sans-serif; color: #2a2340; }
  /* 広場：空・丘・地面を重ねた絵本風の背景 */
  #world {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 18% at 20% 62%, #9fd18b 0 98%, transparent 100%),
      radial-gradient(ellipse 55% 16% at 82% 60%, #a7d896 0 98%, transparent 100%),
      linear-gradient(#bfe3f7 0%, #e6f4fb 45%, #b8e0a2 46%, #9fd18b 100%);
  }
  .cloud { position: absolute; background: #fff; border-radius: 99px; opacity: .85; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 24px; padding: 18px 28px;
    background: rgba(255,255,255,.75); backdrop-filter: blur(6px); z-index: 50; }
  h1 { margin: 0; font-size: 2rem; }
  .count { font-size: 1.2rem; color: #5b4aa8; font-weight: 800; }
  .code { margin-left: auto; text-align: right; }
  .code small { display: block; font-size: .9rem; color: #6a6280; }
  .code b { font-size: 2.6rem; letter-spacing: .2em; color: #d9483b; }
  .staff { font: inherit; font-size: .75rem; border: 0; background: #e6e1f7; border-radius: 99px; padding: 6px 12px; cursor: pointer; }

  /* 歩く守り神 */
  /* --s = 守り神の大きさ。数が増えるほど小さくなる（全員を画面に収めるため） */
  :root { --s: 130px; }
  .walker { position: absolute; width: calc(var(--s) + 20px); text-align: center; z-index: 10; will-change: transform; }
  .walker .body { width: var(--s); height: var(--s); margin: 0 auto; border-radius: 50%; overflow: hidden; border: 4px solid var(--c);
    box-shadow: 0 8px 18px rgba(0,0,0,.18); background: #fff; animation: bob 1.1s ease-in-out infinite; }
  .walker .body img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .walker .shadow { width: calc(var(--s) * .7); height: calc(var(--s) * .1); margin: -4px auto 0; border-radius: 50%; background: rgba(0,0,0,.15); }
  body.small .walker .label { display: none; }   /* 小さくなったら名前は隠す（重なって読めないため） */
  .walker .label { margin-top: 4px; display: inline-block; background: rgba(255,255,255,.9); border-radius: 99px; padding: 2px 10px;
    font-size: .85rem; font-weight: 800; white-space: nowrap; border: 2px solid var(--c); }
  .walker .label span { color: #7a7290; font-weight: 500; margin-right: 4px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* NEW! の登場 */
  #newOverlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100;
    background: rgba(255,255,255,.35); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #newOverlay.show { opacity: 1; }
  .newcard { background: #fffdf8; border-radius: 28px; padding: 28px 36px; text-align: center; border: 8px solid var(--c);
    box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  .newcard .tag { font-size: 3rem; font-weight: 800; color: #d9483b; letter-spacing: .1em; animation: blink 1s infinite; }
  .newcard img { width: 360px; height: 360px; object-fit: cover; border-radius: 20px; display: block; margin: 8px auto 14px; }
  .newcard .nm { font-size: 2.4rem; font-weight: 800; }
  .newcard .tp { font-size: 1.3rem; color: var(--c); font-weight: 800; }
  .newcard .no { color: #7a7290; }
  @keyframes pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes blink { 50% { opacity: .55; } }

  #empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: #5b4aa8; font-weight: 800; }
</style>
<link rel="stylesheet" href="/static/kingdom.css">
</head>
<body class="plaza">
<div id="world"></div>
<header>
  <h1><small>どうぶつ王国</small>みんなの広場</h1>
  <span class="count" id="count">いま 0体</span>
  <div class="code">
    <small>カードのQR → 結果ページで「あいことば」を入れると、ここに出てくるよ</small>
    あいことば <b id="code">{{ code }}</b>
  </div>
</header>
<div id="empty">まだ守り神がいません。カードのQRから広場に出してみてね！</div>
<div id="newOverlay"></div>

<script>
const world = document.getElementById('world');
const walkers = new Map();     // id → {el, x, y, tx, ty, speed}
const queue = [];              // NEW! で見せる順番待ち
const seen = new Set();        // 一度でも受け取った守り神。NEW! で登場している最中に、もう一度登場させないため（2026-10-01に同じ守り神が複数出た）
let first = true, showing = false;

// 雲
for (let i = 0; i < 5; i++) {
  const c = document.createElement('div');
  c.className = 'cloud';
  const w = 120 + Math.random() * 160;
  Object.assign(c.style, { width: w + 'px', height: w * .35 + 'px', top: 90 + Math.random() * 180 + 'px',
    animationDuration: 60 + Math.random() * 60 + 's', animationDelay: -Math.random() * 80 + 's' });
  world.appendChild(c);
}

// 守り神の大きさ：地面の広さを人数で割って決める（130px〜36px）
let size = 130;
function resize(n) {
  const groundW = innerWidth - 40, groundH = innerHeight * 0.54 - 60;
  const per = Math.sqrt(groundW * groundH / Math.max(n, 1)) * 0.62;
  size = Math.max(36, Math.min(130, Math.round(per)));
  document.documentElement.style.setProperty('--s', size + 'px');
  document.body.classList.toggle('small', size < 70);
}
addEventListener('resize', () => resize(walkers.size));

// 歩ける範囲（地面）
function bounds() {
  return { x0: 10, x1: innerWidth - size - 30, y0: innerHeight * 0.46, y1: innerHeight - size - 70 };
}
function randomTarget(w) {
  const b = bounds();
  w.tx = b.x0 + Math.random() * (b.x1 - b.x0);
  w.ty = b.y0 + Math.random() * (b.y1 - b.y0);
}

function addWalker(m) {
  const el = document.createElement('div');
  el.className = 'walker';
  el.style.setProperty('--c', m.color);
  el.innerHTML = `<div class="body"><img src="${m.image}" alt=""></div><div class="shadow"></div>
    <div class="label"><span>No.${String(m.serial).padStart(4, '0')}</span>${esc(m.monster)}</div>`;
  world.appendChild(el);
  const b = bounds();
  const w = { el, x: b.x0 + Math.random() * (b.x1 - b.x0), y: b.y0 + Math.random() * (b.y1 - b.y0),
              speed: 0.35 + Math.random() * 0.35, pause: 0 };
  randomTarget(w);
  walkers.set(m.id, w);
}

// ゆっくり歩く：目的地へ向かい、着いたら少し休んで次の目的地へ
function step() {
  for (const w of walkers.values()) {
    if (w.pause > 0) { w.pause--; }
    else {
      const dx = w.tx - w.x, dy = w.ty - w.y, d = Math.hypot(dx, dy);
      if (d < 4) { w.pause = 60 + Math.random() * 180; randomTarget(w); }
      else { w.x += dx / d * w.speed; w.y += dy / d * w.speed; w.flip = dx < 0; }
    }
    // 手前（下）にいる守り神ほど前に重ねる
    w.el.style.zIndex = 10 + Math.round(w.y);
    w.el.style.transform = `translate(${w.x}px, ${w.y}px)`;
    w.el.querySelector('.body').style.scale = w.flip ? '-1 1' : '1 1';
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

// NEW! の登場：大きく見せてから、広場に入れる
function showNext() {
  if (showing || !queue.length) return;
  showing = true;
  const m = queue.shift();
  const ov = document.getElementById('newOverlay');
  ov.innerHTML = `<div class="newcard" style="--c:${m.color}"><div class="tag">NEW!</div>
    <img src="${m.image}" alt=""><div class="nm">${esc(m.monster)}</div>
    <div class="tp">${esc(m.type_name)}</div><div class="no">No.${String(m.serial).padStart(4, '0')} が広場に来たよ</div></div>`;
  ov.classList.add('show');
  setTimeout(() => {
    ov.classList.remove('show');
    addWalker(m);
    setTimeout(() => { showing = false; showNext(); }, 500);
  }, 4000);
}

async function poll() {
  try {
    const r = await (await fetch('/api/plaza', { cache: 'no-store' })).json();
    document.getElementById('count').textContent = `いま ${r.members.length}体`;
    if (r.code) document.getElementById('code').textContent = r.code;
    const ids = new Set(r.members.map((m) => m.id));
    // 広場から消えた守り神（スタッフが広場を空にしたときなど）だけ取り除く。入った守り神はずっと残る
    for (const [id, w] of walkers) if (!ids.has(id)) { w.el.remove(); walkers.delete(id); seen.delete(id); }
    resize(r.members.length);
    for (const m of r.members) {
      if (seen.has(m.id)) continue;
      seen.add(m.id);
      if (first) addWalker(m);          // 開いたときにいた守り神は、そのまま歩かせる
      else queue.push(m);               // あとから来た守り神は NEW! で登場
    }
    first = false;
    document.getElementById('empty').style.display = (walkers.size || queue.length) ? 'none' : 'flex';
    showNext();
  } catch (e) { /* 通信が切れても広場は止めない */ }
}
poll();
setInterval(poll, 3000);


function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
