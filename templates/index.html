<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>守り神診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --bg: #1b1433; --panel: #2a2150; --panel2: #3b2f6e; --text: #fff; --muted: #b9b0d9; --accent: #ffcc33; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0, #3b2a78, var(--bg) 70%);
    color: var(--text); font-family: "M PLUS Rounded 1c", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: .05em; text-align: center; }
  .lead { margin: 0 0 20px; color: var(--muted); font-size: .92rem; text-align: center; line-height: 1.7; }
  .mock { background: #ff5577; color: #fff; font-size: .75rem; padding: 4px 10px; border-radius: 99px; margin-bottom: 14px; }
  button, a.btn {
    font: inherit; font-weight: 800; border: 0; border-radius: 14px; cursor: pointer; text-decoration: none;
    padding: 14px 18px; background: var(--accent); color: #3a2400;
  }
  button:disabled { opacity: .5; cursor: default; }
  .sub { background: var(--panel) !important; color: var(--text) !important; }
  .big { font-size: 1.15rem; padding: 18px 40px; }
  .hidden { display: none !important; }

  /* 質問 */
  .progress { width: 100%; height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .qnum { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .qtext { font-size: 1.25rem; font-weight: 800; text-align: center; margin: 6px 0 22px; line-height: 1.5; }
  .choices { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .choices button { background: var(--panel2); color: var(--text); padding: 20px 16px; font-size: 1rem; line-height: 1.4; }
  .choices button:active { background: var(--accent); color: #3a2400; }
  .back { margin-top: 18px; background: none; color: var(--muted); font-weight: 500; padding: 6px; }

  /* 好きなもの・絵柄 */
  label.h { font-weight: 800; margin: 6px 0 10px; display: block; text-align: center; line-height: 1.6; }
  label.h small { font-weight: 500; color: var(--muted); }
  input[type=text] {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 14px;
    border: 3px solid #5b4aa8; background: #fff; color: #222;
  }
  .examples { margin: 10px 0 22px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .examples button { background: var(--panel); color: var(--muted); padding: 6px 12px; font-size: .8rem; font-weight: 500; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 24px; }
  .styles button { background: var(--panel2); color: var(--text); padding: 16px 8px; border: 3px solid transparent; }
  .styles button.on { border-color: var(--accent); }
  .styles small { display: block; font-weight: 500; color: var(--muted); font-size: .72rem; margin-top: 4px; }

  /* 作っている間は、ほかのボタンや入力を押せないようにする */
  #s-fav.busy input, #s-fav.busy .examples, #s-fav.busy .styles { pointer-events: none; opacity: .4; }
  #status { min-height: 1.5em; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.6; }
  #status.error { color: #ff8fa3; }
  .spinner { width: 56px; height: 56px; margin: 16px auto; border-radius: 50%;
    border: 6px solid #5b4aa8; border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== カード（54×86mm の比率） ===== */
  .stage { perspective: 1000px; margin-top: 4px; }
  .card {
    width: 300px; aspect-ratio: 54 / 86; border-radius: 14px; padding: 8px; position: relative; overflow: hidden;
    color: #2a2340; background: linear-gradient(160deg, #e6defa, #b3a4e0); box-shadow: 0 12px 40px rgba(0,0,0,.5);
    animation: reveal .9s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes reveal { from { transform: rotateY(180deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .card.daikichi { background: linear-gradient(120deg, #f5c542, #fff1b8, #e0a800, #fff1b8, #f5c542); background-size: 300% 300%;
    animation: reveal .9s cubic-bezier(.2,.8,.2,1), shine 5s linear infinite; }
  @keyframes shine { to { background-position: 300% 0; } }
  .inner { background: #fffdf8; border-radius: 9px; height: 100%; display: flex; flex-direction: column; padding: 10px 11px 9px; gap: 4px; }
  .top { display: flex; align-items: center; font-size: .6rem; font-weight: 800; color: #9a90b8; }
  .luck { margin-left: auto; font-size: .62rem; font-weight: 800; color: #6a5acd; border: 1.5px solid #cfc6ee; border-radius: 99px; padding: 0 7px; }
  .daikichi .luck { color: #a5750a; border-color: #e0b84a; background: #fff6d6; }
  .you { font-size: .62rem; color: #9a90b8; font-weight: 800; margin-top: 2px; }
  .tname { font-size: 1.3rem; font-weight: 800; color: #3b2a78; line-height: 1.15; }
  .art { border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: #eee; width: 100%; margin-top: 2px; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mname { font-size: .6rem; color: #9a90b8; font-weight: 800; }
  .mname b { color: #3b2a78; font-size: .78rem; }
  .catch { font-size: .66rem; line-height: 1.45; }
  .bottom { margin-top: auto; display: flex; gap: 8px; align-items: flex-end; }
  .bottom .info { flex: 1; font-size: .58rem; line-height: 1.5; color: #555; }
  .bottom .info b { color: #6a5acd; }
  .qr { width: 58px; text-align: center; font-size: .42rem; color: #9a90b8; font-weight: 800; line-height: 1.3; }
  .qr img { width: 58px; height: 58px; display: block; }

  .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>守り神診断</h1>
  {% if mock %}<div class="mock">お試しモード：AIを使わずダミーのカードを出しています</div>{% endif %}

  <!-- 1. はじめ -->
  <section id="s-start" class="wrap">
    <p class="lead">8つの質問に答えると、あなたの性格タイプと、<br>あなたを守る「守り神」が決まります。<br>守り神はAIがその場で描く、世界に1体だけ。</p>
    <button class="big" id="startBtn">診断をはじめる</button>
  </section>

  <!-- 2. 質問 -->
  <section id="s-quiz" class="wrap hidden">
    <div class="progress"><i id="bar"></i></div>
    <div class="qnum" id="qnum"></div>
    <div class="qtext" id="qtext"></div>
    <div class="choices"><button id="optA"></button><button id="optB"></button></div>
    <button class="back" id="prevBtn">← ひとつ前にもどる</button>
  </section>

  <!-- 3. 好きなもの・絵柄 -->
  <section id="s-fav" class="wrap hidden">
    <label class="h" for="favorite">さいごに、あなたの好きなものは？<br><small>守り神の姿に入ります</small></label>
    <input id="favorite" type="text" maxlength="20" placeholder="例：ラーメン" autocomplete="off">
    <div class="examples">
      <button type="button">ラーメン</button><button type="button">ねこ</button><button type="button">サッカー</button>
      <button type="button">コーヒー</button><button type="button">昼寝</button><button type="button">宇宙</button>
    </div>
    <label class="h">守り神の絵柄をえらんでね</label>
    <div class="styles" id="styles">
      <button type="button" data-v="cute" class="on">かわいい<small>まるっこい・やさしい色</small></button>
      <button type="button" data-v="cool">かっこいい<small>するどい・迫力がある</small></button>
    </div>
    <button class="big" id="makeBtn">カードを作る！</button>
    <div id="loading" class="hidden"><div class="spinner"></div></div>
    <div id="status"></div>
  </section>

  <!-- 4. 結果（お店の画面） -->
  <section id="s-result" class="wrap hidden">
    <div class="stage" id="stage"></div>

    <div class="actions">
      <button type="button" id="saveBtn">画像を保存</button>
      <a class="btn sub" id="detailLink" target="_blank">詳しい結果を見る</a>
      <button type="button" class="sub" id="nextBtn">つぎの人</button>
    </div>

  </section>
</div>

<script>
const QUESTIONS = {{ questions | tojson }};
const LOADING_MSGS = ['性格を読みといています…', '守り神をよび出しています…', 'AIが絵を描いています…', '運勢を占っています…', 'もうすぐです…'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let answers = [], style = 'cute', current = null;

function show(id) {
  ['s-start', 's-quiz', 's-fav', 's-result'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo({ top: 0 });
}

function renderQuestion() {
  const i = answers.length;
  if (i >= QUESTIONS.length) { show('s-fav'); $('favorite').focus(); return; }
  const q = QUESTIONS[i];
  $('bar').style.width = (i / QUESTIONS.length * 100) + '%';
  $('qnum').textContent = `質問 ${i + 1} / ${QUESTIONS.length}`;
  $('qtext').textContent = q.q;
  $('optA').textContent = q.a[0];
  $('optB').textContent = q.b[0];
  $('prevBtn').classList.toggle('hidden', i === 0);
}

$('startBtn').onclick = () => { answers = []; show('s-quiz'); renderQuestion(); };
$('optA').onclick = () => { answers.push(QUESTIONS[answers.length].a[1]); renderQuestion(); };
$('optB').onclick = () => { answers.push(QUESTIONS[answers.length].b[1]); renderQuestion(); };
$('prevBtn').onclick = () => { answers.pop(); renderQuestion(); };

document.querySelectorAll('.examples button').forEach((b) => b.onclick = () => { $('favorite').value = b.textContent; });
document.querySelectorAll('#styles button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('#styles button').forEach((x) => x.classList.remove('on'));
  b.classList.add('on'); style = b.dataset.v;
});

$('makeBtn').onclick = async () => {
  const favorite = $('favorite').value.trim();
  if (!favorite) { $('status').className = 'error'; $('status').textContent = '好きなものを入れてね'; return; }
  $('makeBtn').disabled = true;
  $('favorite').disabled = true;
  $('s-fav').classList.add('busy');
  $('loading').classList.remove('hidden');
  $('status').className = '';
  let i = 0; $('status').textContent = LOADING_MSGS[0];
  const timer = setInterval(() => { i = (i + 1) % LOADING_MSGS.length; $('status').textContent = LOADING_MSGS[i]; }, 2500);
  try {
    const res = await fetch('/api/card', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers, favorite, style }) });
    const data = await res.json();
    if (!data.ok) { $('status').className = 'error'; $('status').textContent = data.reason; return; }
    current = data;
    renderResult(data);
    show('s-result');
  } catch (err) {
    $('status').className = 'error'; $('status').textContent = '通信に失敗しました。もう一度試してね';
  } finally {
    clearInterval(timer); $('loading').classList.add('hidden'); $('makeBtn').disabled = false;
    $('favorite').disabled = false; $('s-fav').classList.remove('busy');
  }
};

function renderResult(c) {
  $('stage').innerHTML = `
    <div class="card ${c.fortune === '大吉' ? 'daikichi' : ''}" id="card"><div class="inner">
      <div class="top"><span>No.${String(c.serial).padStart(4, '0')}</span><span class="luck">今日の運勢 ${esc(c.fortune)}</span></div>
      <div class="you">あなたは</div>
      <div class="tname">${esc(c.type_name)}</div>
      <div class="art"><img src="${c.image}" alt=""></div>
      <div class="mname">守り神 <b>${esc(c.monster)}</b></div>
      <div class="catch">${esc(c.catch)}</div>
      <div class="bottom">
        <div class="info">
          <b>相性◎</b> ${c.partners.map(esc).join('・')}<br>
          2026.11.21 守り神診断
        </div>
        <div class="qr"><img src="${c.qr}" alt="">詳しい占い・相性</div>
      </div>
    </div></div>`;
  $('detailLink').href = c.url;
}

$('saveBtn').onclick = async () => {
  const canvas = await html2canvas($('card'), { backgroundColor: null, scale: 3 });
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `card-${String(current.serial).padStart(4, '0')}.png`;
  a.click();
};

$('nextBtn').onclick = () => {
  answers = []; $('favorite').value = ''; $('status').textContent = '';
  show('s-start');
};

</script>
</body>
</html>
