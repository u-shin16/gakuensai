<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>性格みくじ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Shippori+Mincho+B1:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --bg: #1b1433; --panel: #2a2150; --panel2: #3b2f6e; --text: #fff; --muted: #b9b0d9; --accent: #ffcc33; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0, #3b2a78, var(--bg) 70%);
    color: var(--text); font-family: "M PLUS Rounded 1c", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: .05em; text-align: center; }
  .lead { margin: 0 0 20px; color: var(--muted); font-size: .92rem; text-align: center; line-height: 1.7; }
  .mock { background: #ff5577; color: #fff; font-size: .75rem; padding: 4px 10px; border-radius: 99px; margin-bottom: 14px; }
  button {
    font: inherit; font-weight: 800; border: 0; border-radius: 14px; cursor: pointer;
    padding: 14px 18px; background: var(--accent); color: #3a2400;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.sub { background: var(--panel); color: var(--text); }
  .big { font-size: 1.15rem; padding: 18px 40px; }
  .hidden { display: none !important; }

  /* 質問 */
  .progress { width: 100%; height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .qnum { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .qtext { font-size: 1.25rem; font-weight: 800; text-align: center; margin: 6px 0 22px; line-height: 1.5; }
  .choices { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .choices button { background: var(--panel2); color: var(--text); padding: 20px 16px; font-size: 1rem; line-height: 1.4; }
  .choices button:active { background: var(--accent); color: #3a2400; }
  .back { margin-top: 18px; background: none; color: var(--muted); font-weight: 500; padding: 6px; }

  /* 好きなもの・絵柄 */
  label.h { font-weight: 800; margin: 6px 0 10px; display: block; text-align: center; }
  input[type=text], input[type=number] {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 14px;
    border: 3px solid #5b4aa8; background: #fff; color: #222;
  }
  .examples { margin: 10px 0 22px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .examples button { background: var(--panel); color: var(--muted); padding: 6px 12px; font-size: .8rem; font-weight: 500; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 24px; }
  .styles button { background: var(--panel2); color: var(--text); padding: 16px 8px; border: 3px solid transparent; }
  .styles button.on { border-color: var(--accent); }
  .styles small { display: block; font-weight: 500; color: var(--muted); font-size: .72rem; margin-top: 4px; }

  #status { min-height: 1.5em; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.6; }
  #status.error { color: #ff8fa3; }
  .spinner { width: 56px; height: 56px; margin: 16px auto; border-radius: 50%;
    border: 6px solid #5b4aa8; border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== おみくじ（54×86mm の比率） ===== */
  .stage { perspective: 1000px; margin-top: 4px; }
  .card {
    width: 300px; aspect-ratio: 54 / 86; border-radius: 6px; padding: 7px; position: relative; overflow: hidden;
    color: #2b1a10; font-family: "Shippori Mincho B1", serif;
    background: #c8321e; box-shadow: 0 12px 40px rgba(0,0,0,.5);
    animation: unroll .9s cubic-bezier(.2,.8,.2,1); transform-origin: top;
  }
  @keyframes unroll { from { transform: scaleY(.05); opacity: 0; } to { transform: none; opacity: 1; } }
  .card.daikichi { background: linear-gradient(135deg, #b8860b, #ffe08a, #b8860b, #ffe08a, #b8860b); background-size: 300% 300%;
    animation: unroll .9s cubic-bezier(.2,.8,.2,1), shine 5s linear infinite; }
  @keyframes shine { to { background-position: 300% 0; } }
  .inner { height: 100%; border: 1.5px solid #c8321e; outline: 3px solid #fbf6ea; outline-offset: -5px;
    background: #fbf6ea radial-gradient(circle at 20% 10%, rgba(200,160,110,.12), transparent 40%);
    border-radius: 3px; display: flex; flex-direction: column; padding: 10px 11px 8px; gap: 3px; }
  .daikichi .inner { border-color: #b8860b; }
  .head { display: flex; justify-content: space-between; align-items: baseline; font-size: .6rem; font-weight: 800; color: #c8321e; letter-spacing: .1em; }
  .fortune { text-align: center; font-size: 2.1rem; font-weight: 800; color: #c8321e; line-height: 1.05; letter-spacing: .15em; margin-top: 2px; }
  .daikichi .fortune { color: #a5750a; text-shadow: 0 0 6px rgba(255,210,90,.6); }
  .tline { text-align: center; font-size: .66rem; }
  .tline b { font-size: .84rem; }
  .art { border-radius: 50%; overflow: hidden; aspect-ratio: 1; width: 52%; margin: 2px auto 0; border: 2px solid #c8321e; background: #eee; }
  .daikichi .art { border-color: #b8860b; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mname { text-align: center; font-size: .58rem; color: #7a5a40; }
  .mname b { font-size: .7rem; color: #2b1a10; }
  .catch { font-size: .64rem; line-height: 1.45; text-align: center; padding: 3px 2px; border-top: 1px dashed #c8a080; border-bottom: 1px dashed #c8a080; }
  .rows { margin: 2px 0 0; font-size: .6rem; line-height: 1.45; display: grid; grid-template-columns: auto 1fr; gap: 1px 6px; flex: 1; align-content: start; }
  .rows dt { font-weight: 800; color: #fff; background: #c8321e; border-radius: 2px; padding: 0 4px; height: fit-content; margin-top: 1px; font-size: .56rem; }
  .daikichi .rows dt { background: #a5750a; }
  .rows dd { margin: 0; }
  .foot { display: flex; justify-content: space-between; font-size: .52rem; color: #9a7a60; font-weight: 800; }

  /* 診断結果 */
  .panel { margin-top: 20px; background: var(--panel); border-radius: 16px; padding: 16px 18px; width: 100%; }
  .panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .axes { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .axes span { background: var(--panel2); border-radius: 99px; padding: 3px 10px; font-size: .75rem; }
  .panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .9rem; }
  .panel dt { color: var(--accent); font-weight: 800; }
  .panel dd { margin: 0; }
  .panel p { margin: 0 0 10px; line-height: 1.6; }

  .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { width: 110px; text-align: center; }
  .matchres { margin-top: 14px; text-align: center; }
  .matchres .score { font-size: 2.4rem; font-weight: 800; color: var(--accent); }
  .matchres ul { text-align: left; margin: 8px 0 0; padding-left: 1.2em; font-size: .88rem; line-height: 1.6; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .chips button { background: var(--panel2); color: var(--text); padding: 8px 12px; font-size: .85rem; }
  .chips button.on { background: var(--accent); color: #3a2400; }
  .center { text-align: center; }
  .thanks { color: var(--accent); font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <h1>性格みくじ</h1>
  {% if mock %}<div class="mock">お試しモード：AIを使わずダミーのカードを出しています</div>{% endif %}

  <!-- 1. はじめ -->
  <section id="s-start" class="wrap">
    <p class="lead">8つの質問に答えると、<br>あなたの性格にぴったりのおみくじが出ます。<br>あなたを守る「守り神」は、AIがその場で描く世界に1体だけ。</p>
    <button class="big" id="startBtn">診断をはじめる</button>
  </section>

  <!-- 2. 質問 -->
  <section id="s-quiz" class="wrap hidden">
    <div class="progress"><i id="bar"></i></div>
    <div class="qnum" id="qnum"></div>
    <div class="qtext" id="qtext"></div>
    <div class="choices"><button id="optA"></button><button id="optB"></button></div>
    <button class="back" id="prevBtn">← ひとつ前にもどる</button>
  </section>

  <!-- 3. 好きなもの・絵柄 -->
  <section id="s-fav" class="wrap hidden">
    <label class="h" for="favorite">さいごに、あなたの好きなものは？<br><small style="font-weight:500;color:var(--muted)">守り神の姿に入ります</small></label>
    <input id="favorite" type="text" maxlength="20" placeholder="例：ラーメン" autocomplete="off">
    <div class="examples">
      <button type="button">ラーメン</button><button type="button">ねこ</button><button type="button">サッカー</button>
      <button type="button">コーヒー</button><button type="button">昼寝</button><button type="button">宇宙</button>
    </div>
    <label class="h">守り神の絵柄をえらんでね</label>
    <div class="styles" id="styles">
      <button type="button" data-v="cute" class="on">かわいい<small>まるっこい・やさしい色</small></button>
      <button type="button" data-v="cool">かっこいい<small>するどい・迫力がある</small></button>
    </div>
    <button class="big" id="makeBtn">おみくじを引く！</button>
    <div id="loading" class="hidden"><div class="spinner"></div></div>
    <div id="status"></div>
  </section>

  <!-- 4. 結果 -->
  <section id="s-result" class="wrap hidden">
    <div class="stage" id="stage"></div>

    <div class="actions">
      <button type="button" id="saveBtn">画像を保存</button>
      <button type="button" class="sub" id="nextBtn">つぎの人が診断する</button>
    </div>

    <div class="panel" id="typePanel"></div>

    <div class="panel">
      <h2>だれかと相性を見る</h2>
      <p>一緒に来た人もカードを作ったら、その人のおみくじの番号（右上の 第○番）を入れてね。</p>
      <div class="row"><input id="otherNo" type="number" min="1" placeholder="No."><button type="button" id="matchBtn">相性を見る</button></div>
      <div class="matchres" id="matchRes"></div>
    </div>

    <div class="panel center" id="survey">
      <p><b>このおみくじ、いくらなら買う？</b></p>
      <div class="chips" id="prices"></div>
      <p><b>もう1回引きたい？</b></p>
      <div class="chips" id="againChips">
        <button type="button" data-v="1">引きたい！</button><button type="button" data-v="0">1回でいい</button>
      </div>
      <button type="button" id="sendBtn" disabled>答える</button>
      <div class="thanks hidden" id="thanks">ありがとう！</div>
    </div>
  </section>
</div>

<script>
const QUESTIONS = {{ questions | tojson }};
const PRICES = [0, 100, 200, 300, 400, 500, 700, 1000];
const LOADING_MSGS = ['性格を読みといています…', 'おみくじを引いています…', '守り神が描かれています…', '運勢を書いています…', 'もうすぐです…'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let answers = [], style = 'cute', current = null, survey = { price: null, again: null };

function show(id) {
  ['s-start', 's-quiz', 's-fav', 's-result'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo({ top: 0 });
}

function renderQuestion() {
  const i = answers.length;
  if (i >= QUESTIONS.length) { show('s-fav'); $('favorite').focus(); return; }
  const q = QUESTIONS[i];
  $('bar').style.width = (i / QUESTIONS.length * 100) + '%';
  $('qnum').textContent = `質問 ${i + 1} / ${QUESTIONS.length}`;
  $('qtext').textContent = q.q;
  $('optA').textContent = q.a[0];
  $('optB').textContent = q.b[0];
  $('prevBtn').classList.toggle('hidden', i === 0);
}

$('startBtn').onclick = () => { answers = []; show('s-quiz'); renderQuestion(); };
$('optA').onclick = () => { answers.push(QUESTIONS[answers.length].a[1]); renderQuestion(); };
$('optB').onclick = () => { answers.push(QUESTIONS[answers.length].b[1]); renderQuestion(); };
$('prevBtn').onclick = () => { answers.pop(); renderQuestion(); };

document.querySelectorAll('.examples button').forEach((b) => b.onclick = () => { $('favorite').value = b.textContent; });
document.querySelectorAll('#styles button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('#styles button').forEach((x) => x.classList.remove('on'));
  b.classList.add('on'); style = b.dataset.v;
});

$('makeBtn').onclick = async () => {
  const favorite = $('favorite').value.trim();
  if (!favorite) { $('status').className = 'error'; $('status').textContent = '好きなものを入れてね'; return; }
  $('makeBtn').disabled = true;
  $('loading').classList.remove('hidden');
  $('status').className = '';
  let i = 0; $('status').textContent = LOADING_MSGS[0];
  const timer = setInterval(() => { i = (i + 1) % LOADING_MSGS.length; $('status').textContent = LOADING_MSGS[i]; }, 2500);
  const t0 = Date.now();
  try {
    const res = await fetch('/api/card', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers, favorite, style }) });
    const data = await res.json();
    if (!data.ok) { $('status').className = 'error'; $('status').textContent = data.reason; return; }
    current = data;
    current.seconds = Math.round((Date.now() - t0) / 1000);
    renderResult(data);
    show('s-result');
  } catch (err) {
    $('status').className = 'error'; $('status').textContent = '通信に失敗しました。もう一度試してね';
  } finally {
    clearInterval(timer); $('loading').classList.add('hidden'); $('makeBtn').disabled = false;
  }
};

function renderResult(c) {
    $('stage').innerHTML = `
    <div class="card ${c.fortune === '大吉' ? 'daikichi' : ''}" id="card"><div class="inner">
      <div class="head"><span>性格みくじ</span><span>第${String(c.serial).padStart(4, '0')}番</span></div>
      <div class="fortune">${esc(c.fortune)}</div>
      <div class="tline">あなたは <b>${esc(c.type_name)}</b></div>
      <div class="art"><img src="${c.image}" alt=""></div>
      <div class="mname">守り神 <b>${esc(c.monster)}</b></div>
      <div class="catch">${esc(c.catch)}</div>
      <dl class="rows">
        <dt>待ち人</dt><dd>${c.partners.map(esc).join('・')}の人</dd>
        <dt>恋愛</dt><dd>${esc(c.love)}</dd>
        <dt>友情</dt><dd>${esc(c.friend)}</dd>
        <dt>学業</dt><dd>${esc(c.study)}</dd>
        <dt>金運</dt><dd>${esc(c.money)}</dd>
        <dt>吉品</dt><dd>${esc(c.lucky)}</dd>
      </dl>
      <div class="foot"><span>強み：${esc(c.strong)}</span><span>2026.11.21</span></div>
    </div></div>`;
  $('typePanel').innerHTML = `
    <h2>あなたは「${esc(c.type_name)}」タイプ</h2>
    <div class="axes">${c.axes.map((a) => `<span>${esc(a)}</span>`).join('')}</div>
    <p>${esc(c.type_desc)}</p>
    <dl>
      <dt>強み</dt><dd>${esc(c.strong)}</dd>
      <dt>弱点</dt><dd>${esc(c.weak)}</dd>
      <dt>相性◎</dt><dd>${c.partners.map(esc).join('、')}</dd>
      <dt>刺激しあう</dt><dd>${esc(c.rival)}（ちがうからこそ、一緒にいると新しい発見がある）</dd>
    </dl>`;
  $('matchRes').innerHTML = ''; $('otherNo').value = '';
  survey = { price: null, again: null };
  document.querySelectorAll('.chips button').forEach((b) => b.classList.remove('on'));
  $('sendBtn').disabled = true; $('sendBtn').classList.remove('hidden'); $('thanks').classList.add('hidden');
}

$('saveBtn').onclick = async () => {
  const canvas = await html2canvas($('card'), { backgroundColor: null, scale: 3 });
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `mikuji-${String(current.serial).padStart(4, '0')}.png`;
  a.click();
};

$('nextBtn').onclick = () => {
  answers = []; $('favorite').value = ''; $('status').textContent = '';
  show('s-start');
};

$('matchBtn').onclick = async () => {
  const b = $('otherNo').value;
  if (!b) return;
  const res = await fetch('/api/match', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ a: current.serial, b: Number(b) }) });
  const m = await res.json();
  if (!m.ok) { $('matchRes').innerHTML = `<p style="color:#ff8fa3">${esc(m.reason)}</p>`; return; }
  $('matchRes').innerHTML = `
    <div>${esc(m.a)} × ${esc(m.b)}</div>
    <div class="score">${m.score}%</div>
    <div><b>${esc(m.title)}</b></div>
    <ul>${m.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`;
};

$('prices').innerHTML = PRICES.map((p) => `<button type="button" data-v="${p}">${p === 0 ? '買わない' : p + '円'}</button>`).join('');
function chip(groupId, key) {
  $(groupId).querySelectorAll('button').forEach((b) => b.onclick = () => {
    $(groupId).querySelectorAll('button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    survey[key] = Number(b.dataset.v);
    $('sendBtn').disabled = survey.price === null || survey.again === null;
  });
}
chip('prices', 'price'); chip('againChips', 'again');
$('sendBtn').onclick = async () => {
  await fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ serial: current.serial, price: survey.price, again: survey.again === 1 }) });
  $('sendBtn').classList.add('hidden'); $('thanks').classList.remove('hidden');
};
</script>
</body>
</html>
