<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>バトル｜どうぶつ王国 観光パスポート</title>
<link rel="stylesheet" href="/static/battle/battle.css">
<style>
  /* どうぶつ王国の色に少し寄せる（元の見た目はそのまま） */
  body { background: #2b1d0f; }
  .topbar { max-width: 32rem; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 12px 6px; display: flex; gap: 10px; align-items: center;
    background: #1d4632; color: #e4c47e; font-weight: 700; }
  .topbar a { color: #e4c47e; text-decoration: none; font-size: .9rem; }
  .topbar span { margin-left: auto; font-size: .8rem; color: #f3e6c4; }
  .err { max-width: 32rem; margin: 0 auto; background: #f4f1ea; padding: 24px 16px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/r/{{ token }}">← パスポートに戻る</a>
  <span>No.{{ '%04d' % r.serial }} {{ r.monster }}{% if enemy %} vs No.{{ '%04d' % enemy.serial }} {{ enemy.monster }}{% else %} vs コンピューター{% endif %}</span>
</div>
{% if error %}
<div class="err"><p>{{ error }}</p><p><a href="/r/{{ token }}">パスポートに戻る</a></p></div>
{% else %}
<main id="app"></main>
<script src="/static/battle/quiz.js"></script>
<script src="/static/battle/battle.js"></script>
<script>
// パスポートに保存してある診断結果で戦う（2026-10-02）
const ME = {{ r.battle | tojson }}, MONTH = {{ r.month | tojson }}, ENEMY = {{ (enemy or None) | tojson }};
if (ENEMY) playBattle(ME, MONTH, ENEMY.result, ENEMY.month);   // 友だちのパスポートと
else window.AnimalBattle.start(ME, MONTH);                       // コンピューター（ランダム）と
// 終わったときの「診断からやり直す」は、ここでは「もう一度（新しい相手と）」になる（ページを読み直すため）
new MutationObserver(() => {
  const b = document.getElementById('restart');
  if (b && !b.dataset.relabeled) { b.dataset.relabeled = '1'; b.textContent = ENEMY ? 'もう一度戦う' : '新しい相手と戦う'; }
}).observe(document.getElementById('app'), { childList: true, subtree: true });
</script>
{% endif %}
</body>
</html>
