<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>バトル｜どうぶつ王国 観光パスポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/battle/battle.css">
<link rel="stylesheet" href="/static/battle/kingdom-battle.css">
<style>
  /* どうぶつ王国の色に少し寄せる（元の見た目はそのまま） */
  .topbar { max-width: 32rem; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 12px 6px; display: flex; gap: 10px; align-items: center;
    background: #2f6f4e; color: #fff; font-weight: 700; }
  .topbar a { color: #fff; text-decoration: none; font-size: .9rem; }
  .topbar span { margin-left: auto; font-size: .8rem; color: #d7eadf; }
  
  .waitbox { display: flex; flex-direction: column; gap: .8rem; flex: 1; }
  .wait-card { text-align: center; padding: 1.4rem 1rem 1.1rem !important; }
  .wait-card h2 { font-size: 1.05rem !important; color: #2f6f4e !important; }
  .wait-card p { line-height: 1.7; }
  .myno { display: inline-block; margin: .6rem auto; padding: .3rem 1.2rem; border-radius: 14px; background: #2f6f4e; color: #fff;
    font-size: 2rem; font-weight: 800; letter-spacing: .08em; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: .6rem; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #2f6f4e; animation: dot 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  /* 相手が切断中（2026-10-02） */
  #pvp-gone { position: fixed; inset: 0; z-index: 20; background: rgba(74,56,38,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #pvp-gone .gone-box { background: #fffaf0; border: 2px solid #e6d8b4; border-radius: 20px; padding: 1.3rem 1.2rem; max-width: 22rem; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: gonein .25s ease-out; }
  #pvp-gone h2 { margin: .3rem 0 .4rem; color: #c8442f; font-size: 1.15rem; }
  #pvp-gone p { margin: .3rem 0; color: #4a3826; line-height: 1.6; font-size: .92rem; }
  #pvp-gone .gone-left { font-weight: 800; color: #3f7429; }
  #pvp-gone .gone-leave { width: 100%; margin-top: .8rem; }
  @keyframes gonein { from { transform: scale(.94); } to { transform: none; } }
  /* battle.js の終わりのボタンは使わない（すぐ結果の画面に切りかえるため、一瞬も見せない） */
  #rematch, #restart { display: none !important; }
  /* 結果の画面（2026-10-02） */
  .result-screen { display: flex; flex-direction: column; gap: .6rem; flex: 1 1 auto; min-height: 0; animation: rIn .35s ease-out; }
  @keyframes rIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .result-screen > .phase { align-self: center; margin: 0; }
  .r-outcome { margin: 0; text-align: center; font-size: 2.2rem; letter-spacing: .1em; animation: rPop .5s cubic-bezier(.3,1.6,.5,1); }
  .result-screen.win .r-outcome { color: #c47f22; text-shadow: 0 3px 0 #f5d7a2; }
  .result-screen.lose .r-outcome { color: #5a6b7a; }
  .result-screen.draw .r-outcome { color: #3f7429; }
  @keyframes rPop { from { transform: scale(.6); } to { transform: none; } }
  .r-note { margin: -.3rem 0 0; text-align: center; color: #8a765a; font-size: .9rem; }
  .r-vs { display: flex; align-items: center; justify-content: center; gap: .6rem; }
  .r-side { flex: 1; max-width: 10rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: .15rem; }
  .r-side b { font-size: .85rem; color: #3f7429; } .r-side small { font-size: .8rem; color: #8a765a; }
  .r-art { width: clamp(4rem, 13vh, 6.5rem); height: clamp(4rem, 13vh, 6.5rem); border-radius: 18px; overflow: hidden; border: 3px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.15); background: #fdf6e6; display: grid; place-items: center; color: #8a765a; font-weight: 800; }
  .r-art img { width: 100%; height: 100%; object-fit: cover; }
  .result-screen.win .r-side.me .r-art, .result-screen.lose .r-side.foe .r-art { border-color: #f2a541; animation: rBob 1.6s ease-in-out infinite; }
  @keyframes rBob { 50% { transform: translateY(-5px); } }
  .r-x { font-weight: 900; color: #a5713d; font-size: 1.1rem; }
  .r-log { flex: 1 1 auto; min-height: 5rem; display: flex; flex-direction: column; overflow: hidden; }
  .r-log h2 { margin: 0 0 .3rem; }
  .r-log .log { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; max-height: none !important; font-size: .88rem; }
  .r-log .log p { margin: .15rem 0; padding-bottom: .15rem; border-bottom: 1px dashed #eadfc7; }
  .r-dock { flex: none; margin-top: 0 !important; }
  .r-dock .ghost { margin-top: .5rem; width: 100%; }
  @keyframes dot { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="topbar">
  <a href="/r/{{ token }}">← パスポートに戻る</a>
  <span>No.{{ '%04d' % r.serial }} {{ r.monster }}{% if enemy %} vs No.{{ '%04d' % enemy.serial }} {{ enemy.monster }}{% elif error %} 友人戦{% else %} vs コンピューター{% endif %}</span>
</div>
{% if error %}
<main id="app"><div class="waitbox"><p class="phase">友人戦</p><div class="win wait-card"><h2>{{ error }}</h2></div>
  </div></main>
{% else %}
<main id="app"></main>
<script src="/static/battle/quiz.js"></script>
<script src="/static/battle/battle.js"></script>
<script src="/static/battle/pvp.js"></script>
<script>
// パスポートに保存してある診断結果で戦う（2026-10-02）
const ME = {{ r.battle | tojson }}, MONTH = {{ r.month | tojson }}, ENEMY = {{ (enemy or None) | tojson }};
const TOKEN = {{ token | tojson }}, MYNO = {{ r.serial | tojson }};
const PASSPORT = '/r/' + TOKEN;
const AGAIN = new URLSearchParams(location.search).get('again') === '1';
const no4 = (n) => 'No.' + String(n).padStart(4, '0');
const app = document.getElementById('app');

// キャラの絵の欄に、パスポートの案内アニマルの絵を出す（自分。友人戦なら相手も）。コンピューターの相手は battle.js の絵のまま
const MY_IMG = '/img/{{ r.image_file }}', FOE_IMG = {{ ((enemy.image_file and '/img/' ~ enemy.image_file) if enemy else '') | tojson }};
function setArt(sel, src) {
  const img = document.querySelector(sel);
  if (img && src && img.getAttribute('src') !== src) { img.hidden = false; img.onerror = null; img.src = src; }
}
const againUrl = () => ENEMY ? location.pathname + '?vs=' + ENEMY.serial + '&again=1' : location.pathname;

// 戦いが終わったら、結果とログが見える画面に切りかえる（2026-10-02 ゆーしん「ログが見える画面に飛んで、もう一回・パスポートに戻るを選べるように」）
// battle.js が終わりのボタン（#rematch）を出したら、すぐその画面のHP・ログを読み取って結果の画面を作る
let resultShown = false;
function showResult() {
  if (resultShown) return;
  resultShown = true;
  const phase = (document.querySelector('.phase') || {}).textContent || '';
  let outcome = phase.replace(/^ラウンド\s*\d+\s*/, '').trim() || '対戦終了';
  const round = (phase.match(/ラウンド\s*(\d+)/) || [])[1] || '';
  const huds = [...document.querySelectorAll('.hud')].map((h) => ({
    name: (h.querySelector('h2') || {}).textContent || '',
    hp: [...h.querySelectorAll('.hud-top p')].map((p) => p.textContent).find((t) => t.startsWith('HP')) || '' }));
  const foe = huds[0] || {}, me = huds[1] || {};
  const myImg = (document.querySelector('.actor.player .portrait img') || {}).src || MY_IMG;
  const foeImg = (document.querySelector('.actor.enemy .portrait img') || {}).src || '';
  // ログは battle.js の「ログ」の中身を読む（開いてすぐ閉じる）
  let logHtml = '';
  const openLog = document.getElementById('open-log');
  if (openLog) {
    openLog.click();
    const sheet = document.getElementById('sheet');
    logHtml = ((sheet && sheet.querySelector('.log')) || {}).innerHTML || '';
    if (sheet) sheet.hidden = true;
    const bd = document.getElementById('backdrop'); if (bd) bd.hidden = true;
  }
  let note = '';
  if (/もどってこなかった/.test(outcome)) { note = outcome; outcome = 'おつかれさま'; }
  else if (/はなれている間/.test(outcome)) { note = outcome; outcome = 'おつかれさま'; }
  const tone = /勝ち/.test(outcome) ? 'win' : /負け/.test(outcome) ? 'lose' : 'draw';
  const art = (src, label) => `<div class="r-art">${src && !/\/art\//.test(src) ? `<img src="${src}" alt="">` : `<span>${label}</span>`}</div>`;
  app.innerHTML = `
    <div class="result-screen ${tone}">
      <p class="phase">${round ? 'ラウンド ' + round + '　' : ''}対戦終了</p>
      <h1 class="r-outcome">${outcome}</h1>
      ${note ? `<p class="r-note">${note}</p>` : ''}
      <div class="r-vs">
        <div class="r-side me">${art(myImg, 'あなた')}<b>${me.name}</b><small>${me.hp}</small></div>
        <span class="r-x">VS</span>
        <div class="r-side foe">${art(foeImg, '相手')}<b>${foe.name}</b><small>${foe.hp}</small></div>
      </div>
      <div class="win r-log"><h2>バトルのログ</h2><div class="log">${logHtml || '<p>ログはありません</p>'}</div></div>
      <div class="dock r-dock">
        <button class="primary" id="r-again" type="button">もう一回</button>
        <button class="ghost" id="r-back" type="button">パスポートに戻る</button>
      </div>
    </div>`;
  const log = app.querySelector('.r-log .log'); if (log) log.scrollTop = log.scrollHeight;
  document.getElementById('r-again').onclick = () => { location.href = againUrl(); };
  document.getElementById('r-back').onclick = () => { location.href = PASSPORT; };
}

new MutationObserver(() => {
  if (resultShown) return;
  setArt('.actor.player .portrait img', MY_IMG);
  setArt('.actor.enemy .portrait img', FOE_IMG);
  const again = document.getElementById('rematch');
  if (again && !again.dataset.kd) {
    again.dataset.kd = '1';
    const back = document.getElementById('restart'); if (back) back.remove();
    again.hidden = true;            // 「結果を見る」のボタンは出さず、すぐ結果の画面へ（2026-10-02 ゆーしん）
    setTimeout(showResult, 0);
  }
}).observe(app, { childList: true, subtree: true });

if (!ENEMY) {
  window.AnimalBattle.start(ME, MONTH);   // コンピューター（ランダム）と
} else {
  // 友人戦：2人ともおたがいの番号を入れているときだけ始まる。それまでは「待っています」を出す
  let stop = false, started = Date.now();
  const LIMIT = 3 * 60 * 1000;   // 3分待っても来なければ、いったん止める
  function waitingView() {
    app.innerHTML = `
      <div class="waitbox">
        <p class="phase">友人戦の待ち合わせ</p>
        <div class="win wait-card">
          <div class="dots"><i></i><i></i><i></i></div>
          <h2>${no4(ENEMY.serial)} ${ENEMY.monster ? '（' + ENEMY.monster + '）' : ''}の人を待っています</h2>
          <p>相手の人も、自分のパスポートの「この人と戦う」に<br>あなたの番号を入れてね</p>
          <div class="myno">${no4(MYNO)}</div>
          <p class="detail">2人とも番号を入れると、自動でバトルが始まります。<br>2人で交代に技を選んで戦います</p>
        </div>
      </div>`;
  }
  // 自分がはなれている間に、対戦が終わっていたとき
  function forfeitedView() {
    app.innerHTML = `
      <div class="waitbox">
        <p class="phase">友人戦</p>
        <div class="win wait-card"><h2>前の対戦は、はなれている間に終わったよ</h2>
          <p>もう一度戦うときは、下のボタンを押して、相手にも番号を入れてもらってね</p></div>
        <div class="dock"><button class="primary" id="retry" type="button">もう一回</button></div>
      </div>`;
    document.getElementById('retry').onclick = () => { location.href = location.pathname + '?vs=' + ENEMY.serial + '&again=1'; };
  }
  function timeoutView() {
    app.innerHTML = `
      <div class="waitbox">
        <p class="phase">友人戦の待ち合わせ</p>
        <div class="win wait-card"><h2>相手の人が来ませんでした</h2>
          <p>相手の人が ${no4(MYNO)} を入れているか、たしかめてね</p></div>
        <div class="dock"><button class="primary" id="retry" type="button">もう一度待つ</button></div>
      </div>`;
    document.getElementById('retry').onclick = () => location.reload();
  }
  // 左上の「パスポートに戻る」で出ていったら、待ち合わせをやめたことにする
  window.addEventListener('pagehide', () => {
    if (stop) return;
    navigator.sendBeacon('/api/battle/wait', new Blob([JSON.stringify({ token: TOKEN, vs: ENEMY.serial, leave: true })], { type: 'application/json' }));
  });
  async function poll() {
    if (stop) return;
    if (Date.now() - started > LIMIT) { stop = true; timeoutView(); return; }
    try {
      const r = await (await fetch('/api/battle/wait', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN, vs: ENEMY.serial, again: AGAIN }) })).json();
      if (r.forfeited) { stop = true; forfeitedView(); return; }
      // 2人そろったら、交代で技を選ぶ対戦を始める（pvp.js）
      if (r.ready) { stop = true; window.playPvp({ id: r.match, token: TOKEN, seed: r.seed, side: r.side,
        me: ME, meMonth: MONTH, foe: ENEMY.result, foeMonth: ENEMY.month }); return; }
    } catch (e) {}
    setTimeout(poll, 2000);
  }
  waitingView();
  poll();
}
</script>
{% endif %}
</body>
</html>
